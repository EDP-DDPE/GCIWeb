<!-- Widget flutuante do Atlas GPT (presente em todas as páginas via base.html) -->
<button id="atlas-widget-toggle" title="Conversar com o Atlas" data-no-loading="true">
    <img src="{{ url_for('main.static', filename='images/atlas_icon_v3_white.png') }}" alt="Atlas">
</button>

<div id="atlas-widget-panel" class="aw-hidden">
    <div class="aw-header">
        <div class="aw-header-title">
            <img src="{{ url_for('main.static', filename='images/atlas_icon_v3_white.png') }}" alt="Atlas">
            <span>Atlas GPT</span>
        </div>
        <div class="aw-header-actions">
            <button id="atlas-widget-new" title="Nova conversa" data-no-loading="true"><i class="fas fa-plus"></i></button>
            <a href="{{ url_for('bot.atlas') }}" title="Abrir em tela cheia"><i class="fas fa-expand"></i></a>
            <button id="atlas-widget-close" title="Fechar" data-no-loading="true"><i class="fas fa-times"></i></button>
        </div>
    </div>

    <div id="atlas-widget-messages" class="aw-messages">
        <div class="aw-empty">
            <div class="aw-empty-icon">💭</div>
            <div>Olá! Sou o Atlas. Como posso ajudar?</div>
        </div>
    </div>

    <div id="atlas-widget-typing" class="aw-typing">
        <div class="aw-dot"></div>
        <div class="aw-dot"></div>
        <div class="aw-dot"></div>
    </div>

    <div class="aw-input-area">
        <textarea id="atlas-widget-input" rows="1" placeholder="Pergunte ao Atlas..."></textarea>
        <button id="atlas-widget-send" title="Enviar" data-no-loading="true">
            <svg viewBox="0 0 24 24" width="18" height="18">
                <path fill="currentColor"
                      d="M12 2l4 4h-3v7h-2V6H8l4-4zm-7 9v11h14V11h2v13H3V11h2z"/>
            </svg>
        </button>
    </div>
</div>
